# SPDX-License-Identifier: MIT
#
# Builds the portable core and the Linux harness, runs the unit tests and the fuzz smoke runs.
# Nothing here needs a secret, a lab cluster or the network beyond the package mirror: the live lab tests
# (harness/lab, label "lab") are never part of CI. The Ceph run-time data of vectors.yml is not needed either.
#
#   build-test       gcc and clang, each plain and with -DWR_SANITIZE=address,undefined: cmake, -Werror build, ctest; in the plain
#                    flavours also the constant-time checks of the secure-mode crypto under Valgrind (required: a runner image that
#                    loses Valgrind turns the job red, it is not a skip)
#   compile-matrix   compile-only: gcc -m32, clang -m32, and the iPXE-flag build of the core (gcc); the object code of
#                    those builds goes through the no-libc and no-globals checks too
#   object-gates     the no-libc / no-globals / sources-in-sync checks on OPTIMISED builds (Release and MinSizeRel, gcc and
#                    clang): the test jobs build Debug, where a compiler never turns a loop into a library call
#   static-limits    call depth and worst-case stack of the core, measured from gcc's call graph (no recursion); the chains of
#                    part B (map decode, incremental apply, placement), of part C (the OSD step, the image step, the request
#                    encode, the reply decode, and the reply path through the msgr2 upper-layer table) and of part D (secure
#                    mode: the receive step, the transmit frame, the GCM update chain and their neighbours) also have a budget of
#                    their own
#   ipxe-gates       the gates that keep the core buildable by iPXE, with the pinned iPXE tree checked out (every other job runs without it, so
#                    there the header gates skip): the core compiled against iPXE's own reduced <stdint.h> and <string.h> with iPXE's flags
#                    and the shim ipxe/src/rbd_core_cfg.h (i386 and x86_64) and the undefined symbols of those objects checked against what iPXE
#                    defines out of line (a call to memmove() would not link), every file with -std=gnu17 and -std=gnu2x (iPXE sets
#                    no -std; gcc 15 defaults to C23), ipxe/tools/build.sh check, the call-depth and stack budgets of the glue-facing entry
#                    points with -Os and -m32 -Os (the flags of the BIOS images; every core function the glue calls must have a budget), and
#                    the self-test that feeds each gate a seeded violation. A skip is a failure here (WRT_IPXE_REQUIRE=1)
#   fuzz-smoke       clang + libFuzzer, 30 s per target, seeded from harness/fuzz/seeds (the checkout is not modified); a
#                    target that was not built, or has no committed seeds, fails the job (the five targets of part B, the
#                    seven of part C, the five of part D and the two of Phase 2 are named)
#
# Two runner images. ubuntu-24.04 (gcc 13.3, clang 18.1) is the one the call-graph job and the measured numbers of the docs are pinned to,
# so they stay comparable from run to run. ubuntu-26.04 (gcc 15.2, clang 21.1.8, the image core.yml reaches as ubuntu-latest) is where the
# newest compilers' warnings and frame sizes show up first: build-test and fuzz-smoke run on both, so the sanitizer build with clang 21
# (the flavour that once measured 1,048 bytes for two functions of the map half against the 1,024-byte rule) is a CI job and not only a
# check on the lab box. harness/tools/ci26_vm.sh builds the same 26.04 toolchain on the lab box, so the whole matrix of this file (the
# sanitizers, Release and MinSizeRel, -m32, the iPXE flags) is also run there before a change lands.
#
# Warnings are errors everywhere (WR_WERROR is ON by default and is never turned off here).
name: harness

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }} ${{ matrix.cc }}${{ matrix.sanitize != '' && ' + asan/ubsan' || '' }}
    runs-on: ${{ matrix.os }}
    # Part D added tests that are slow by design: the secure peers of the host tests use the independent (slow) GCM, so host.loop.sec and
    # host.tool.rbd.sec take 2 to 3 minutes each in a plain Debug build on 8 cores and 5 to 7 minutes under the sanitizers (they run alone,
    # RUN_SERIAL), and the whole suite is about 15 minutes at -j 4 on 8 cores. A runner has 4: the limit leaves a factor of three or more.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
        cc: [gcc, clang]
        sanitize: ["", "address,undefined"]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libssl-dev python3 valgrind ${{ matrix.cc == 'clang' && 'clang' || 'gcc' }}

      # The runner kernels randomise mmap addresses more widely than the AddressSanitizer runtimes of both
      # compilers can place their shadow memory around, and the instrumented tests then die at start with a SEGV that
      # has nothing to do with the code. Lowering the randomisation is the documented workaround; a failure to do so is
      # reported (and then the tests tell if it mattered), it is not a reason to stop.
      - name: Make AddressSanitizer start reliably
        if: matrix.sanitize != ''
        run: sudo sysctl -w vm.mmap_rnd_bits=28 || echo "::warning::could not lower vm.mmap_rnd_bits"

      - name: Configure
        run: >
          cmake -S harness -B build/harness -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DWR_SANITIZE=${{ matrix.sanitize }}

      - name: Build
        run: cmake --build build/harness

      # core_no_libc and core_no_globals look at the object code and are registered only in the plain builds (the sanitizer
      # runtime adds symbols); the seed replays (fuzzseed.*) run in every flavour. The sanitizers are built with
      # -fno-sanitize-recover=all (harness/cmake/WrWarnings.cmake), so a finding is a failing test, not a log line.
      - name: Test
        env:
          ASAN_OPTIONS: strict_string_checks=1:detect_stack_use_after_return=1:detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build/harness --output-on-failure -j 4 --timeout 600 -E '^crypto\.ct\.valgrind$'

      # The constant-time claim of the secure-mode crypto (AES, GHASH, GCM and the nonce stream, docs/design/core-architecture.md 35.6)
      # is checked on the OBJECT CODE: Valgrind runs the test with the key, the IV and the data marked as undefined, so a branch or an
      # address that depends on them is reported (and the known-bad control, a table AES and an early-exit compare, must be reported or
      # the check fails), and the read-only data scan fails a table of 256 bytes or more. WRT_CT_REQUIRE=1 turns a missing Valgrind (or
      # a missing binutils tool) into a failure instead of a skip, so the check cannot disappear from a runner image unnoticed. Not in
      # the sanitizer flavours: the sanitizer runtimes do not run under Valgrind (the test says so and skips, exit 77, there).
      - name: Constant-time checks under Valgrind
        if: matrix.sanitize == ''
        env:
          WRT_CT_REQUIRE: 1
        run: ctest --test-dir build/harness --output-on-failure --timeout 1800 -R '^crypto\.ct\.' --no-tests=error

      # The same claim by a second, independent method (design 41.4): the crypto of the core is built into a small program that takes its
      # secrets from a file, run under Valgrind's lackey tool with eight different secrets (random, all zero bits, all one bits), and the
      # traces of the executed instructions and touched addresses must be identical, while the table AES of the cephx code must give a
      # different one for every secret (the control: a check that cannot see a table fails). All five optimisation levels with the compiler of the job. A
      # missing Valgrind or static C library is a failure here, as above.
      - name: Constant-time traces under Valgrind
        if: matrix.sanitize == ''
        env:
          WRT_CT_REQUIRE: 1
        run: sh harness/tools/ct_trace_check.sh --cc ${{ matrix.cc }}

  compile-matrix:
    name: compile only (${{ matrix.os }}, ${{ matrix.cc }}, -m32, iPXE flags)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libssl-dev python3 gcc-multilib ${{ matrix.cc == 'clang' && 'clang' || '' }}

      # -fno-pie: the distro compilers default to position-independent code, whose objects name _GLOBAL_OFFSET_TABLE_;
      # iPXE and the driver are not built that way, and the object gates below would flag the symbol.
      # -fno-builtin-memcmp (clang): at -O2 clang rewrites memcmp(...) == 0 into a call to bcmp, which is not on the
      # list of functions the core may reference (memcpy, memmove, memset). The core compares with wri_ct_memeq and has no memcmp
      # of its own, so the flag only keeps a compiler from inventing one.
      - name: Configure
        run: |
          flags="-fno-pie"
          if [ "${{ matrix.cc }}" = clang ]; then flags="$flags -fno-builtin-memcmp"; fi
          cmake -S harness -B build/harness -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_C_FLAGS="$flags" \
            -DWR_WITH_OPENSSL=OFF

      # wr_core_m32 (size_t and pointers are 32 bits, as on i386 iPXE) exists for gcc and clang; wr_core_ipxe_flags
      # (-ffreestanding -Os and the warning set of the iPXE build) exists for gcc. Both are object-only targets.
      - name: Build the 32-bit core
        run: cmake --build build/harness --target wr_core_m32

      - name: Build the core with the iPXE flags
        if: matrix.cc == 'gcc'
        run: cmake --build build/harness --target wr_core_ipxe_flags

      - name: Every header compiles on its own
        run: cmake --build build/harness --target wr_header_check

      # The mechanical gates of the 64-bit library, applied to the object code that matters for the other hosts: no
      # libc beyond memcpy/memmove/memset and the compiler's own arithmetic helpers, no writable global.
      - name: Gates on the 32-bit objects
        run: |
          ar rcs build/core_m32.a $(find build/harness/CMakeFiles/wr_core_m32.dir -name '*.o')
          sh harness/tools/check_no_libc.sh build/core_m32.a
          sh harness/tools/check_no_globals.sh build/core_m32.a

      - name: Gates on the iPXE-flag objects
        if: matrix.cc == 'gcc'
        run: |
          ar rcs build/core_ipxe.a $(find build/harness/CMakeFiles/wr_core_ipxe_flags.dir -name '*.o')
          sh harness/tools/check_no_libc.sh build/core_ipxe.a
          sh harness/tools/check_no_globals.sh build/core_ipxe.a

  object-gates:
    name: object gates (${{ matrix.os }}, ${{ matrix.cc }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
        cc: [gcc, clang]
        build_type: [Release, MinSizeRel]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build python3 ${{ matrix.cc == 'clang' && 'clang' || 'gcc' }}

      # Only the library is built (no tests, no host): the point is what the optimiser makes of the core. The
      # -fno-builtin-memcmp for clang is explained in the compile-matrix job.
      - name: Configure
        run: |
          flags=""
          if [ "${{ matrix.cc }}" = clang ]; then flags="-fno-builtin-memcmp"; fi
          cmake -S harness -B build/gates -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_C_FLAGS="$flags" \
            -DWR_WITH_OPENSSL=OFF -DWR_BUILD_HOST=OFF

      - name: Build the core
        run: cmake --build build/gates --target wr_core

      - name: core_sources_in_sync, core_no_libc, core_no_globals
        run: ctest --test-dir build/gates --output-on-failure -R '^core_' --no-tests=error

  # Both images: the budgets below are the larger of the gcc 13 and gcc 15 measurements plus about 8 %, so a change that grows a chain
  # fails on whichever compiler measures it larger.
  static-limits:
    name: call depth and stack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc python3

      # No recursion, at most 17 frames deep, at most 3,328 bytes of stack along any chain (measured with gcc 13: 17 frames
      # and 3,064 bytes; gcc 15 on the 26.04 box: 17 and 3,080. The deepest chain is, since part D, the AUTH_SIGNATURE frame that goes out
      # in secure mode: the handshake > the connection's send > the secure frame builder > the first GCM refill > the tag > the GHASH
      # multiplication, 17 frames and only 1,304 bytes of stack, three frames more than the 14 of part C, whose deepest chain was a failed
      # image cancelling its operations down to the session reset. The depth limit follows the measured depth like every other number
      # here, and the stack, which is what a frame count stands for, did not move: the largest stack is still the incremental apply of
      # the map store, which decodes the full map embedded in an incremental and audits its rules). The per-entry budgets are ratchets about 8 % above the measured stack of each entry point
      # (part B: placement 1,528, store step 2,792, full-map decode 1,720, incremental apply 2,488, CRUSH decode 568, rule
      # interpreter 696 bytes; part C: OSD step 912, image step 1,080, the engine's OSD stage 944, the request encode 152,
      # the reply decode 264 bytes); an entry that is renamed away is an error, not a pass. An earlier version of the check
      # read the sizes in directory order and let a node without a size (a function a file only calls) overwrite the size of
      # its definition, which reported 1,632 bytes for the same chain; the check now keeps the largest size.
      # Calls through function pointers (the store's I/O hooks, 16 bytes at most) end a chain in this measurement; the one
      # that matters for part C, the msgr2 connection handing a complete message to the upper layer's table, is added by the
      # next step.
      - name: Measure
        run: >
          python3 harness/tests/ci-docs-hardening/check_callgraph.py --cc gcc --depth 17 --stack 3328
          --entry wr_client_map_target=1664
          --entry wri_mapstore_step=3072
          --entry wri_osdmap_decode_full=1920
          --entry wri_osdmap_apply_inc=2752
          --entry wri_crush_decode=640
          --entry wri_crush_do_rule=768
          --entry wri_osdc_step=992
          --entry wri_client_osd_begin=1024
          --entry wri_rbd_step=1168
          --entry wri_mosdop_encode=168
          --entry wri_mosdopreply_decode=288

      # The reply path of part C. A complete OSD message reaches the session through the upper-layer table of the msgr2
      # connection (`c->up->message(...)`), a call gcc's graph cannot see, so the chain would end at the connection and the
      # decoder's stack would never be added to the frames that are live when it runs. `--link` adds that edge (for the OSD
      # session and the monitor client alike) and the budgets below are measured through it, from the connection's frame
      # parser down: the OSD session's message handler 1,128 bytes (the largest branch is the answer to a backoff, its
      # encoder included; the plain reply decode is 264), and the parser frame above both handlers (192 bytes of its own: 1,320
      # through the OSD session, 1,792 through the monitor client, whose message path decodes a map). `--entry=NAME` is the same option as
      # `--entry NAME` (argparse), spelt so that the part B test map.hardening, which reads the `--entry NAME` tokens of the
      # step above, does not take file-qualified names for a plain function name.
      - name: Measure the reply path through the msgr2 table
        run: >
          python3 harness/tests/ci-docs-hardening/check_callgraph.py --cc gcc --depth 17 --stack 3328
          --link wri_m2c_ready_frame=core/src/osd/wri_osd_sess_up.c:up_message
          --link wri_m2c_ready_frame=core/src/mon/wri_mon.c:up_message
          --entry=core/src/osd/wri_osd_sess_up.c:up_message=1224
          --entry=wri_m2c_ready_frame=1936

      # The chains of part D (docs/design/core-architecture.md 36.4). Budget = the larger of the stack measured with gcc 13 (24.04) and
      # gcc 15 (26.04), plus about 8 %, rounded up to 8 bytes (measured, gcc 13 / gcc 15, in bytes): the secure receive step 888 / 920;
      # the secure transmit frame 840 / 888 (its refill, which finishes the tag, is the tail of the chain) and the consume that refills
      # 552 / 600; the portable GCM update 408 / 440 (the update inside it 392 / 408) on top of the GHASH multiplication
      # (`wri_ghash_blocks` 328 / 344: its own frame is 224 / 240 bytes against the design target of 128, section 41.3); the two tags
      # (`final_enc` 456 / 488, `final_dec` 472 / 488); the key schedule 288 / 320; the switch 568 / 584; the bitsliced block function
      # 176 / 208; and the two chains from the connection down: the receive parser with the secure step under it 1,000 / 1,032 and the
      # connection's send of one frame 1,256 / 1,304. The calls through the host's GCM hook end a chain in this measurement; the hook's
      # own frames are the host's to bound. An entry that is renamed away is an error, not a pass.
      - name: Measure the secure-mode chains
        run: >
          python3 harness/tests/ci-docs-hardening/check_callgraph.py --cc gcc --depth 17 --stack 3328
          --entry wri_m2s_rx_step=1000
          --entry wri_m2s_tx_frame=960
          --entry wri_m2s_tx_consume=648
          --entry wri_pgcm_update=480
          --entry wri_pgcm_final_enc=528
          --entry wri_pgcm_final_dec=528
          --entry wri_pgcm_setkey=352
          --entry wri_m2_secure_on=632
          --entry wri_ghash_blocks=376
          --entry wri_aesct_encrypt_blocks=232
          --entry wri_m2_rx_step=1120
          --entry wri_m2c_send=1416

  # The core as iPXE builds it. No other job has third_party/ipxe checked out; this one has, and WRT_IPXE_REQUIRE=1 turns a gate that
  # could not run (no tree, no -m32) into a red job instead of a skip. Both images: gcc 13 judges as 24.04's iPXE build would, gcc 15 (C23 by
  # default) as 26.04's. The same gates also run inside ctest (core_std_c, core_ipxe_headers_*, core_callgraph_*, ipxe.check, gates.selftest), where the
  # header ones skip without the submodule.
  ipxe-gates:
    name: iPXE build gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      WRT_IPXE_REQUIRE: 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v4

      # Only the iPXE submodule; full history, because the pinned revision is not a branch tip (the same as ipxe.yml).
      - name: Fetch the pinned iPXE
        run: git submodule update --init third_party/ipxe

      # gcc-multilib: -m32 (the BIOS images are i386; the call graph of the 32-bit build includes the system headers). clang: the -std check.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gcc-multilib clang python3

      - name: ipxe/tools/build.sh check
        run: bash ipxe/tools/build.sh check

      # iPXE's <stdint.h> has no uintptr_t and no limit macros, its memmove is inline only: the shim (ipxe/src/rbd_core_cfg.h) supplies them,
      # and a core file that uses another macro, or a shim that loses one, is a red job here before it is a red iPXE build. i386 and x86_64,
      # iPXE's own flags and -Werror, no -std (so the compiler's default).
      - name: The core against iPXE's headers
        run: sh harness/tools/check_ipxe_headers.sh -c gcc

      # iPXE sets no -std: gcc 15 gives it C23, where bool, true, false, nullptr and constexpr are keywords. Strict C99 (the harness) cannot see that.
      - name: The core as gnu17 and gnu2x
        run: |
          sh harness/tools/check_core_std.sh -c gcc
          sh harness/tools/check_core_std.sh -c clang
          sh harness/tools/check_core_std.sh -c gcc -m "-m32"

      # The budgets of the entry points the glue calls (wr_client_run, wr_conn_*, wr_image_*, the handoff, URL and readahead modules), measured
      # as iPXE builds: -Os, and -m32 -Os for the BIOS images. The numbers and how they were set are in the script. `static-limits` above is the
      # -O2 x86_64 measurement of the same core and is unchanged.
      - name: Call depth and stack as iPXE builds it
        run: sh harness/tests/ci-docs-hardening/callgraph_ipxe.sh --cc gcc both

      # Each gate above must fail on a seeded violation (a deepened chain, a core file using INT16_MAX, a shim without uintptr_t, a variable
      # called true); a gate that cannot fail proves nothing.
      - name: The gates reject seeded violations
        run: python3 -I harness/tests/ci-docs-hardening/gates_selftest.py --cc gcc

  fuzz-smoke:
    name: fuzz smoke (${{ matrix.os }}, clang, 30 s per target)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build clang python3

      # WR_FUZZ=ON alone instruments only the fuzz target files, not the core library, so the fuzzer would see no coverage
      # of the code under test. WR_SANITIZE puts ASan and UBSan on the core and the tests, and the global flag adds the
      # libFuzzer coverage instrumentation to everything, core included.
      - name: Configure
        run: >
          cmake -S harness -B build/fuzz -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_C_FLAGS=-fsanitize=fuzzer-no-link
          -DWR_FUZZ=ON
          -DWR_SANITIZE=address,undefined
          -DWR_WITH_OPENSSL=OFF

      - name: Build the fuzz targets
        run: cmake --build build/fuzz

      # The loop below runs whatever was built. This step is what makes a missing part B target a red job instead of a
      # shorter run: the five targets of the OSD map, CRUSH and map store modules must exist and must have committed seeds.
      - name: The part B targets exist and have seeds
        run: |
          set -eu
          for t in fuzz_crush_dec fuzz_crush_map fuzz_osdmap_full fuzz_osdmap_inc fuzz_mapstore; do
            [ -x "build/fuzz/$t" ] || { echo "::error::$t was not built"; exit 1; }
            [ -n "$(ls harness/fuzz/seeds/$t 2>/dev/null)" ] || { echo "::error::$t has no committed seeds"; exit 1; }
          done

      # The same for the seven part C targets (OSD messages, RBD class calls and open, OSD sessions, the request engine, the whole
      # client with an image on it).
      - name: The part C targets exist and have seeds
        run: |
          set -eu
          for t in fuzz_osd_reply fuzz_osd_backoff fuzz_rbd_cls fuzz_osd_sess fuzz_osd_req fuzz_rbd_open fuzz_client_osd; do
            [ -x "build/fuzz/$t" ] || { echo "::error::$t was not built"; exit 1; }
            [ -n "$(ls harness/fuzz/seeds/$t 2>/dev/null)" ] || { echo "::error::$t has no committed seeds"; exit 1; }
          done

      # The same for the five part D targets (secure mode: the GCM operation scripts against the textbook reference, the transmit and the
      # receive codec of the secure frames, a whole secure connection against the simulator, the whole client under a secure policy), and
      # for the seeds that fuzz_cx_reply gained in part D (replies that carry a connection secret, good and bad lengths, both versions).
      - name: The part D targets exist and have seeds
        run: |
          set -eu
          for t in fuzz_gcm fuzz_m2_sec_tx fuzz_m2_sec_rx fuzz_m2_conn_sec fuzz_client_secure; do
            [ -x "build/fuzz/$t" ] || { echo "::error::$t was not built"; exit 1; }
            [ -n "$(ls harness/fuzz/seeds/$t 2>/dev/null)" ] || { echo "::error::$t has no committed seeds"; exit 1; }
          done
          [ -n "$(ls harness/fuzz/seeds/fuzz_cx_reply/sec_* 2>/dev/null)" ] || { echo "::error::fuzz_cx_reply lost its secret-carrying seeds"; exit 1; }

      # The same for the two Phase 2 targets (the rBFT handoff table codec, the rbd:// URL parser).
      - name: The Phase 2 targets exist and have seeds
        run: |
          set -eu
          for t in fuzz_handoff fuzz_rburl; do
            [ -x "build/fuzz/$t" ] || { echo "::error::$t was not built"; exit 1; }
            [ -n "$(ls harness/fuzz/seeds/$t 2>/dev/null)" ] || { echo "::error::$t has no committed seeds"; exit 1; }
          done

      # The whole set: every target that was built, except the smoke target of the harness itself, has committed seeds, and the number of
      # targets is the number of fuzz_*.c files of harness/fuzz (a target that stops being built, or a new one nobody seeded, is a red job).
      - name: Every target exists and has seeds
        run: |
          set -eu
          built=0
          for src in harness/fuzz/fuzz_*.c; do
            t=$(basename "$src" .c)
            [ "$t" = fuzz_replay_main ] && continue
            [ -x "build/fuzz/$t" ] || { echo "::error::$t was not built"; exit 1; }
            built=$((built + 1))
            [ "$t" = fuzz_smoke ] && continue
            [ -n "$(ls harness/fuzz/seeds/$t 2>/dev/null)" ] || { echo "::error::$t has no committed seeds"; exit 1; }
          done
          echo "$built fuzz targets built, all seeded"

      # Each target runs on a COPY of its seeds, so the new inputs libFuzzer finds stay out of the checkout.
      # A crash leaves crash-* / oom-* / timeout-* files in build/fuzz-artifacts and fails the step.
      - name: Run every target for 30 s
        run: |
          set -eu
          mkdir -p build/fuzz-artifacts
          status=0
          for exe in build/fuzz/fuzz_*; do
            [ -f "$exe" ] && [ -x "$exe" ] || continue
            name=$(basename "$exe")
            corpus="build/fuzz-corpus/$name"
            mkdir -p "$corpus"
            if [ -d "harness/fuzz/seeds/$name" ]; then
              cp harness/fuzz/seeds/"$name"/* "$corpus"/ 2>/dev/null || true
            fi
            # 64 KiB for every target, as in tools/fuzz_long.sh: the map and CRUSH targets take whole maps and the committed
            # seeds of several targets are larger than 4 KiB (up to 53 KB), which a 4 KiB cap would cut.
            echo "::group::$name"
            if ! "$exe" -max_total_time=30 -max_len=65536 -rss_limit_mb=4096 -timeout=60 \
                 -artifact_prefix="build/fuzz-artifacts/${name}-" "$corpus"; then
              echo "::error::$name failed"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      # Only on failure, and only the inputs libFuzzer wrote because they crashed a target. Those are made by the
      # fuzzer from the committed seeds (public, scrubbed vectors); no key, token or lab file is ever part of a run.
      - name: Keep the crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: build/fuzz-artifacts/
          if-no-files-found: ignore
          retention-days: 14
